<svg xmlns="http://www.w3.org/2000/svg" width="400" height="840" viewBox="0 0 400 840" data-palette="e6e656-a4e76a-f6dbac-487e6f3e2a2b" role="img" aria-labelledby="process-mobile-light-title process-mobile-light-desc"><title id="process-mobile-light-title">CoverLock process</title><desc id="process-mobile-light-desc">The three mock covers pass the local size and safe-zone checks.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="400" y2="840"><stop stop-color="#78782d"/><stop offset=".6" stop-color="#5b7f3b"/><stop offset="1" stop-color="#82735b"/></linearGradient><radialGradient id="halo"><stop stop-color="#78782d" stop-opacity=".22"/><stop offset="1" stop-color="#fefef9" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7f7cb" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#78782d" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="400" height="840" rx="16" fill="#fefef9"/><rect width="400" height="840" rx="16" fill="url(#grid)"/><ellipse cx="252.0" cy="361.2" rx="200.0" ry="588.0" fill="url(#halo)"/><text x="28" y="44" fill="#6f7768" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="28" y="84.0" fill="#272a1c" font-size="25" text-anchor="start" font-weight="400">Render the three-cover</text><text x="28" y="119.0" fill="#272a1c" font-size="25" text-anchor="start" font-weight="400">offline example</text><path d="M200 257V290" fill="none" stroke="#78782d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 257V290" class="flow" fill="none" stroke="#82735b" stroke-width="2"/><rect x="28" y="135" width="344" height="122" rx="12" fill="#fefef7" stroke="#f7f7cb"/><text x="46" y="166.0" fill="#272a1c" font-size="21" text-anchor="start" font-weight="400">01  Lock pack</text><text x="46" y="218.0" fill="#6f7768" font-size="17" text-anchor="start" font-weight="400">Freeze the shipped demo</text><text x="46" y="241.8" fill="#6f7768" font-size="17" text-anchor="start" font-weight="400">settings</text><path d="M200 412V445" fill="none" stroke="#78782d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 412V445" class="flow" fill="none" stroke="#82735b" stroke-width="2"/><rect x="28" y="290" width="344" height="122" rx="12" fill="#fefef7" stroke="#f7f7cb"/><text x="46" y="321.0" fill="#272a1c" font-size="21" text-anchor="start" font-weight="400">02  Generate set</text><text x="46" y="373.0" fill="#6f7768" font-size="17" text-anchor="start" font-weight="400">3 mock covers at 1080x1350</text><path d="M200 567V600" fill="none" stroke="#78782d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 567V600" class="flow" fill="none" stroke="#82735b" stroke-width="2"/><rect x="28" y="445" width="344" height="122" rx="12" fill="#fefef7" stroke="#f7f7cb"/><text x="46" y="476.0" fill="#272a1c" font-size="21" text-anchor="start" font-weight="400">03  Revise one</text><text x="46" y="528.0" fill="#6f7768" font-size="17" text-anchor="start" font-weight="400">Regenerate cover 02</text><rect x="28" y="600" width="344" height="122" rx="12" fill="#fefef7" stroke="#f7f7cb"/><text x="46" y="631.0" fill="#272a1c" font-size="21" text-anchor="start" font-weight="400">04  Inspect gallery</text><text x="46" y="683.0" fill="#6f7768" font-size="17" text-anchor="start" font-weight="400">3/3 size and title checks</text><text x="28" y="775.0" fill="#82735b" font-size="18" text-anchor="start" font-weight="400">The three mock covers pass the</text><text x="28" y="800.2" fill="#82735b" font-size="18" text-anchor="start" font-weight="400">local size and safe-zone checks.</text></svg>
