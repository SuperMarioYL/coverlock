<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     role="img" aria-label="CoverLock 流程：locked style-pack → 国产图像模型/mock → compose 尺寸与标题安全区 → 10 covers → consistency gallery">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- 节点中心 y = 160；5 节点 x 中心: 88, 286, 484, 660, 800 -->
  <!-- ── 底层静态连线 + 箭头 ───────────────────────────────────────── -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="168" y1="160" x2="204" y2="160" marker-end="url(#ah-l)"/>
    <line x1="366" y1="160" x2="402" y2="160" marker-end="url(#ah-l)"/>
    <line x1="564" y1="160" x2="600" y2="160" marker-end="url(#ah-l)"/>
    <line x1="720" y1="160" x2="748" y2="160" marker-end="url(#ah-l)"/>
  </g>

  <!-- ── 行军虚线数据流（周期16，from 32→0；负 begin 错峰）───────────── -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="168" y1="160" x2="202" y2="160" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="366" y1="160" x2="400" y2="160" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="564" y1="160" x2="598" y2="160" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="720" y1="160" x2="746" y2="160" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ── 数据包圆点沿连线流动 ─────────────────────────────────────── -->
  <g>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M168,160 L202,160" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M366,160 L400,160" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M564,160 L598,160" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M720,160 L746,160" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── 节点：呼吸 fill-opacity 0.10↔0.18，负 begin 错峰 ──────────── -->
  <!-- 1. style-pack (locked) — 紫 -->
  <g>
    <rect x="16" y="118" width="152" height="84" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="92" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">style-pack</text>
    <text x="92" y="176" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">locked · sha256</text>
  </g>
  <!-- 2. 国产图像模型 / mock — 青 -->
  <g>
    <rect x="204" y="118" width="162" height="84" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="285" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">国产图像模型</text>
    <text x="285" y="176" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">doubao · qwen · mock</text>
  </g>
  <!-- 3. compose (尺寸 + 标题安全区) — 紫 -->
  <g>
    <rect x="402" y="118" width="162" height="84" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="483" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">compose</text>
    <text x="483" y="176" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">尺寸 4:5/3:4 · 安全区</text>
  </g>
  <!-- 4. 10 covers — 青 -->
  <g>
    <rect x="600" y="118" width="120" height="84" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="660" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">10 covers</text>
    <text x="660" y="176" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">cover_01..10.png</text>
  </g>
  <!-- 5. consistency gallery — 紫 -->
  <g>
    <rect x="748" y="118" width="116" height="84" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-3.0s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="806" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">gallery</text>
    <text x="806" y="170" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">一致性自证</text>
    <text x="806" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#0B6B53">10/10 ✓</text>
  </g>

  <!-- 标题 + 副标 -->
  <text x="16" y="58" font-size="18" font-weight="700" fill="#1D1D1F">CoverLock 流程</text>
  <text x="16" y="82" font-size="13" font-weight="500" fill="#6E6E73">锁定一次 style-pack，之后每帖封面自动继承同一视觉 · 尺寸合规 · 标题在安全区</text>
  <!-- owned value 注脚 -->
  <text x="16" y="300" font-size="12" font-weight="500" fill="#8A8A90">owned value 全在离线层（compose / rules / stylepack / gallery）——模型可插拔、可离线 mock</text>
</svg>
